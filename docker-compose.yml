services:
  unitman-proxy:
    image: nginx
    restart: always
    volumes:
      - ./.docker/proxy/nginx.conf:/etc/nginx/nginx.conf
      - ./.docker/proxy/index.html:/usr/share/nginx/html/index.html
    ports:
      - '8087:80'
  node-exporter:
    image: prom/node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    container_name: exporter
    hostname: exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points
      - ^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)
    ports:
      - 9100:9100
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./.docker/prometheus:/etc/prometheus/
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"

  grafana:
    build:
      context: ./.docker/grafana/
    user: root
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    #volumes:
    #  - ./var/volume/grafana:/var/lib/grafana
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
networks:
  default:
    external: true
    name: unitman_default
