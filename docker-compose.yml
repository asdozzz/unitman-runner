services:
  unitman-proxy:
    extends:
      file: common-services.yml
      service: unitman-proxy

  node-exporter:
    extends:
      file: common-services.yml
      service: node-exporter

  prometheus:
    extends:
      file: common-services.yml
      service: prometheus

  grafana:
    extends:
      file: common-services.yml
      service: grafana

  unitman-registry:
    extends:
      file: common-services.yml
      service: unitman-registry

networks:
  default:
    external: true
    name: unitman_default
