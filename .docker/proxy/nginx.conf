events {
    worker_connections  2048;
    multi_accept on;
    use epoll;
}

http {
    # WebSocket: подменяем Connection на "upgrade" только когда клиент прислал
    # Upgrade. Без этого code-server получает обычный GET и отвечает 302/404,
    # а браузер падает с WebSocket close 1006.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
     listen 80 default_server;

     # Lightweight proxy health/check endpoint.
     # Public path: GET /__unitman/health
     # Returns 200 with Content-Type: text/plain and the stable marker body
     # "Unitman Proxy Host\n". Served locally by nginx and never proxied upstream,
     # so it works even when no unit/workspace containers are running.
     location = /__unitman/health {
       default_type text/plain;
       access_log off;
       add_header Cache-Control "no-store" always;
       return 200 "Unitman Proxy Host\n";
     }

     location / {
       # This would be the directory where your React app's static files are stored at
       root /usr/share/nginx/html;
       try_files $uri /index.html;
     }
    }

    # IDE стартует по требованию: пока контейнер ide не поднят, upstream
    # недоступен. Для порта IDE отдаём страницу ожидания с автообновлением,
    # чтобы первое открытие ссылки не показывало голый 502.
    #
    # Порт должен совпадать с UNITMAN_IDE_PORT (по умолчанию 47000).
    server {
        resolver 127.0.0.11 valid=30s ipv6=off;
        listen 80;
        server_name ~^47000\.(?<unit>[^.]+)\.(?<project>[^.]+)\.(.+)$;

        error_page 502 503 504 = @ide_starting;

        location / {
            proxy_pass http://$unit.$project:47000;
            # Перехватываем 502/503/504 upstream, чтобы отдать страницу ожидания.
            proxy_intercept_errors on;
            # WebSocket требует HTTP/1.1 и проброс Upgrade/Connection.
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout       300;
            proxy_send_timeout          300;
            proxy_read_timeout          300;
            send_timeout                300;
        }

        location @ide_starting {
            default_type text/html;
            add_header Cache-Control "no-store" always;
            return 200 '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="2"><title>Unitman IDE</title></head><body style="font-family:sans-serif;padding:2rem"><h1>Редактор запускается…</h1><p>Страница обновится автоматически.</p></body></html>';
        }
    }

    server {
        resolver 127.0.0.11 valid=30s ipv6=off;
        listen 80;
        server_name ~^(?<port>[^.]+)\.(?<unit>[^.]+)\.(?<project>[^.]+)\.(.+)$;

        location / {
            proxy_pass http://$unit.$project:$port;
            # WebSocket требует HTTP/1.1 и проброс Upgrade/Connection.
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout       300;
            proxy_send_timeout          300;
            proxy_read_timeout          300;
            send_timeout                300;
        }
    }
}
