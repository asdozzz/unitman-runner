services:
  unit:
    container_name: ${UNITMAN_UNIT_NAME}.${UNITMAN_PROJECT_NAME}
    user: root
    privileged: true
    build:
      context: .
    working_dir: /app
    userns_mode: keep-id
    mem_limit: ${UNITMAN_MEMORY_LIMIT:-3g}
    memswap_limit: ${UNITMAN_MEMORY_LIMIT:-3g}
    volumes:
      - unit_app:/app
      - unit_containers:/var/lib/containers
      # Read-only источник для первичного seed git. Рабочая копия живёт в unit_app.
      - ../../mainBranch/.git:/seed/git:ro
      # Staging вложений, которые подготовил runner.
      - ./seed:/seed:ro
      - ./podman-config/registries.conf:/usr/share/containers/registries.conf.d/99-override.conf:ro
    env_file:
      - .env

  # Read-only IDE. Порт 47000 не публикуется на хост: сервис живёт
  # в network namespace контейнера unit и доступен через proxy по поддомену.
  #
  # Ограничение podman-compose: network_mode: "service:unit" не поддерживается.
  # Совместимый эквивалент — netns контейнера unit по его container_name.
  ide:
    image: asdozzz/unitman-ide:latest
    build:
      context: ./ide
    network_mode: "container:${UNITMAN_UNIT_NAME}.${UNITMAN_PROJECT_NAME}"
    depends_on:
      - unit
    userns_mode: keep-id
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - unit_app:/home/coder/project:ro
    tmpfs:
      - /tmp
      - /run
    environment:
      - GIT_OPTIONAL_LOCKS=0
      - GIT_INDEX_FILE=/tmp/git-index
      - HOME=/home/coder

volumes:
  unit_app:
    external: true
    name: ${UNITMAN_UNIT_APP_VOLUME}
  unit_containers:
    external: true
    name: ${UNITMAN_UNIT_CONTAINERS_VOLUME}

networks:
  default:
    external: true
    name: unitman_default
