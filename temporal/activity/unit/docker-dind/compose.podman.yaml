services:
  unit:
    container_name: ${UNITMAN_UNIT_NAME}.${UNITMAN_PROJECT_NAME}
    user: root
    privileged: true
    # Предсобранный podman-образ юнита. Сборки на месте нет.
    image: "${UNITMAN_UNIT_IMAGE_NAME:-asdozzz/unitman-unit:latest}"
    working_dir: /app
    userns_mode: keep-id
    mem_limit: ${UNITMAN_MEMORY_LIMIT:-3g}
    memswap_limit: ${UNITMAN_MEMORY_LIMIT:-3g}
    volumes:
      - unit_app:/app
      - unit_containers:/var/lib/containers
      # Read-only источник для первичного seed git. Рабочая копия живёт в unit_app.
      # Внимание: /seed/git и /seed/volumes — соседние точки монтирования.
      # Сам /seed монтировать нельзя: вложенный ro-монт /seed/git требует mkdir
      # внутри уже примонтированного ro-каталога и падает с EROFS.
      - ../../mainBranch/.git:/seed/git:ro
      # Staging вложений, которые подготовил runner: <unit>/seed/volumes -> /seed/volumes.
      - ./seed/volumes:/seed/volumes:ro
      - ./podman-config/registries.conf:/usr/share/containers/registries.conf.d/99-override.conf:ro
    env_file:
      - .env

  # Read-only IDE. Порт 47000 не публикуется на хост: сервис живёт
  # в network namespace контейнера unit и доступен через proxy по поддомену.
  #
  # Ограничение podman-compose: network_mode: "service:unit" не поддерживается.
  # Совместимый эквивалент — netns контейнера unit по его container_name.
  # Профиль ide: редактор поднимается по требованию, а не при подготовке.
  ide:
    profiles: ["ide"]
    image: "${UNITMAN_IDE_IMAGE:-asdozzz/unitman-ide:latest}"
    network_mode: "container:${UNITMAN_UNIT_NAME}.${UNITMAN_PROJECT_NAME}"
    depends_on:
      - unit
    userns_mode: keep-id
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - unit_app:/home/coder/project:ro
    tmpfs:
      - /tmp
      - /run
      # XDG-каталоги code-server: корневая ФС read-only, в HOME писать нельзя.
      - /home/coder/.config
      - /home/coder/.local
      - /home/coder/.cache
    environment:
      - GIT_OPTIONAL_LOCKS=0
      - GIT_INDEX_FILE=/tmp/git-index
      - HOME=/home/coder

volumes:
  unit_app:
    external: true
    name: ${UNITMAN_UNIT_APP_VOLUME}
  unit_containers:
    external: true
    name: ${UNITMAN_UNIT_CONTAINERS_VOLUME}

networks:
  default:
    external: true
    name: unitman_default
