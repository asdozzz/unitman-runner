unqualified-search-registries = ["docker.io", "registry.fedoraproject.org", "registry.access.redhat.com"]

# Полностью отключаем интерактивные вопросы при отсутствии TTY
short-name-mode = "disabled"

# Настройки и зеркала для docker.io.
#
# registries.conf не поддерживает подстановку переменных окружения, а этот
# файл монтируется в контейнер read-only, поэтому во время запуска его нельзя
# переписать из entrypoint. Зеркало конкретного реестра раннера здесь больше
# не задаётся: адрес реестра приходит при регистрации в UNITMAN_REGISTRY_HOST
# и применяется в entrypoint через флаги dockerd (--registry-mirror и
# --insecure-registry). Оставляем только публичное зеркало docker.io.
[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "mirror.gcr.io"
