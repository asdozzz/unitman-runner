services:
  workspace:
    container_name: ${UNITMAN_WORKSPACE_SLUG}.workspaces
    runtime: sysbox-runc
    image: asdozzz/unitman-workspace:latest
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: ${UNITMAN_MEMORY_LIMIT:-3072m}
    memswap_limit: ${UNITMAN_MEMORY_LIMIT:-3072m}
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/.workspace_ready && test -S /var/run/docker.sock && docker info >/dev/null 2>&1" ]
      interval: 0.5s
      timeout: 1s
      retries: 120
      start_period: 0.5s
    working_dir: /workspace
    environment:
      - UNITMAN_BRANCH_NAME=${UNITMAN_BRANCH_NAME:-}
      - UNITMAN_READ_ONLY=${UNITMAN_READ_ONLY:-false}
      # Реестр выдаётся при регистрации раннера и пишется в .env. Значение
      # обязательно: default/fallback запрещён.
      - UNITMAN_REGISTRY_HOST=${UNITMAN_REGISTRY_HOST:?UNITMAN_REGISTRY_HOST is required}
    volumes:
      - workspace_app:/workspace
      - workspace_docker:/var/lib/docker
      - workspace_opencode:/root/.local/share/opencode

  # IDE работает в network namespace workspace и видит app-том read-only.
  ide:
    container_name: ${UNITMAN_WORKSPACE_SLUG}.ide
    image: asdozzz/unitman-workspace-ide:latest
    build:
      context: ./ide
    network_mode: "service:workspace"
    depends_on:
      - workspace
    read_only: true
    mem_limit: 512m
    memswap_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O- http://127.0.0.1:47000/healthz >/dev/null 2>&1 || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 1s
    volumes:
      - workspace_app:/home/coder/workspace:ro
    tmpfs:
      - /tmp
      - /run
      # XDG-каталоги code-server: корневая ФС read-only, в HOME писать нельзя.
      - /home/coder/.config
      - /home/coder/.local
      - /home/coder/.cache
    environment:
      - HOME=/home/coder
      - UNITMAN_WORKSPACE_MULTI_ROOT=1

volumes:
  workspace_app:
    external: true
    name: ${UNITMAN_WORKSPACE_APP_VOLUME}
  workspace_docker:
    external: true
    name: ${UNITMAN_WORKSPACE_DOCKER_VOLUME}
  workspace_opencode:
    external: true
    name: ${UNITMAN_WORKSPACE_OPENCODE_VOLUME}

networks:
  default:
    external: true
    name: unitman_default
